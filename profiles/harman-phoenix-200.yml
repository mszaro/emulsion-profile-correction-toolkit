# Harman Phoenix I 200, scanned by a lab as if it were a Kodak or Fuji stock.
name: Harman Phoenix 200

# Green and blue come back with black floors 20 to 35 levels above red, which
# is clipped, so the shadows go green. The highlights tip pink. Each roll is
# balanced toward how Superia renders neutral, tone by tone: by the film's own
# cast below, then by up to a stop more for how its lab session drifted.
reference: fujifilm-superia
roll_balance: 1.0
roll_balance_limit: 1.0

# The film's own cast, per tone, as [red, green, blue] stops, measured by
# tools/measure_film.rb against FujiFilm Superia 200 and 400 from 3 rolls:
#   49605 Ilford Harman Phoenix
#   49606 Ilford Harman Phoenix
#   49607 Ilford Harman Phoenix
film_gains:
  - [-0.473, 0.286, -1.081]
  - [0.097, -0.079, 0.528]
  - [0.360, -0.095, 0.130]
  - [0.395, -0.064, -0.342]
  - [0.175, -0.010, -0.419]
  - [0.010, 0.031, -0.357]
  - [-0.363, 0.110, 0.200]
  - [-0.239, 0.083, -0.003]

# Then each frame on its own, since the lab balanced every frame a little
# differently. Phoenix frames drift by half a stop or so; anything larger is
# the scene, such as a frame full of leaves, and is left alone.
frame_balance: 1.0
frame_balance_limit: 0.6

# Highlights come back bunched near white with the midtones pushed up to
# meet them, so the roll is given Superia's tonal spread.
roll_tone: 1.0

# Several daylight frames come back with a cream sky while the buildings in
# the same frame are properly white, because a sky is not grey and the
# balance is fitted on greys. Measured on Superia, a daylight sky never
# comes out warmer than neutral, so one that does here is brought back to
# it, never past it, and only where the sky is.
sky_floor: 0.75

# The corners measure as losing a stop and a half of red, most of which is
# the crushed red floor rather than the lens, so the lift stays off here as
# it does everywhere else.
flat_field: 0.0

# Once balanced its colour is not squashed, so the gamut fit has nothing to do.
roll_fit: 0.0

# The frame balance above does this job, so the older balance is off.
neutral: 0.0
wb: 0.0
wb_clamp: 1.6
shadow_wb: 0.8

# Saturated film once balanced, so the boost only lifts a flat frame.
target_saturation: 0.26
max_vibrance: 1.5
knee: 0.22

# Blacks are lifted and whites held back, so each frame is stretched.
black: 0.4
white: 99.7
max_stretch: 3.2
contrast: 0.10

# Coarse grain with a colour speckle in the lifted shadows.
chroma: 0.7

# The film's own look against rolls shot alongside it, learned by
# tools/measure_look.rb from 6 pairs. Lightness and the average colour at each brightness; --match gives a
# roll its own instead.
#   49607 Ilford Harman Phoenix with 49608 FujiFilm Superia 200
#   49606 Ilford Harman Phoenix with 49612 FujiFilm Superia 400, 49613 FujiFilm Superia 400
#   49605 Ilford Harman Phoenix with 49614 FujiFilm Superia 400
#   50192 Ilford Harman Phoenix with 49614 FujiFilm Superia 400
#   51055 Ilford Harman Phoenix with 51052 FujiFilm Superia 400
#   51056 Ilford Harman Phoenix with 51050 FujiFilm Superia 400, 51047 FujiFilm Superia 400
