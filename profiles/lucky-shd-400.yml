# Lucky SHD 400, scanned by a lab as if it were a Kodak or Fuji stock.
name: Lucky SHD 400

# Blue sags through the upper midtones while the whites stay clean, so the
# scans look shot through a yellow filter, and red rides a little high. Each
# roll is balanced toward how Superia renders neutral, tone by tone: by the
# film's own cast below, then by up to a stop more for how its lab session
# drifted.
reference: fujifilm-superia
roll_balance: 1.0
roll_balance_limit: 1.0

# The film's own cast, per tone, as [red, green, blue] stops, measured by
# tools/measure_film.rb against FujiFilm Superia 200 and 400 from 3 rolls:
#   49602 Lucky SHD 400
#   49603 Lucky SHD 400
#   49604 Lucky SHD 400
film_gains:
  - [0.002, 0.069, -0.585]
  - [-0.003, 0.088, -0.676]
  - [-0.131, 0.049, -0.053]
  - [-0.931, 0.267, 1.073]
  - [-0.672, 0.200, 1.536]
  - [-0.391, 0.097, 1.644]
  - [-0.401, 0.031, 1.927]
  - [-0.061, 0.011, 0.090]

# How this film's colour sits against FujiFilm Superia 200 and 400, after the gains
# above have done what they can, measured by tools/measure_shape.rb from:
#   49602 Lucky SHD 400
#   49603 Lucky SHD 400
#   49604 Lucky SHD 400
# against:
#   49612 FujiFilm Superia 400
#   49613 FujiFilm Superia 400
chroma_map:
  matrix: [1.2628, 0.6220]
  offset: [-0.5783, 0.3230]

# The map above is bent onto Superia in full, and then the pixels whose blue
# arrived with nothing in it are eased partway toward grey. The two work on
# different pixels: the map reshapes the colour that survived, and the easing
# takes the shout out of the colour that did not.
chroma_shape: 1.0
lost_colour: 0.5

# A gain of two stops on a sky that is already bright has nowhere to go, and
# blue stops at white while green carries on up, which leaves the sky pale
# cyan. This lets such a pixel darken by up to a stop and a half instead, so
# the colour the gains asked for survives.
highlight_headroom: 1.5

# Then each frame on its own, since the lab balanced every frame differently,
# some by two stops or more.
frame_balance: 1.0
frame_balance_limit: 2.5

# Tones come back a little bunched toward the highlights.
roll_tone: 0.5

# Once balanced its colour is not squashed, so the gamut fit has nothing to do.
roll_fit: 0.0

# The frame balance above does this job, so the older balance is off.
neutral: 0.0
wb: 0.0
wb_clamp: 1.8
shadow_wb: 0.8

target_saturation: 0.26
max_vibrance: 1.5
knee: 0.22

black: 0.4
white: 99.7
max_stretch: 3.2
contrast: 0.10

chroma: 0.7
