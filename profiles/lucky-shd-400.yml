# Lucky SHD 400, scanned by a lab as if it were a Kodak or Fuji stock.
name: Lucky SHD 400

# Blue sags through the upper midtones while the whites stay clean, so the
# scans look shot through a yellow filter, and red rides a little high. Each
# roll is balanced toward how Superia renders neutral, tone by tone: by the
# film's own cast below, then by up to a stop more for how its lab session
# drifted. It is taken about three quarters of the way, which keeps some of
# the film's warmth: side by side, the full correction bleached the stone
# and turned skies pink.
reference: fujifilm-superia
roll_balance: 0.78
roll_balance_limit: 1.0

# The film's own cast, per tone, as [red, green, blue] stops, measured by
# tools/measure_film.rb against FujiFilm Superia 200 and 400 from 3 rolls:
#   49602 Lucky SHD 400
#   49603 Lucky SHD 400
#   49604 Lucky SHD 400
film_gains:
  - [0.002, 0.069, -0.585]
  - [-0.003, 0.088, -0.676]
  - [-0.131, 0.049, -0.053]
  - [-0.931, 0.267, 1.073]
  - [-0.672, 0.200, 1.536]
  - [-0.391, 0.097, 1.644]
  - [-0.401, 0.031, 1.927]
  - [-0.061, 0.011, 0.090]

# How this film's colour sits against FujiFilm Superia 200 and 400, after the gains
# above have done what they can, measured by tools/measure_shape.rb from:
#   49602 Lucky SHD 400
#   49603 Lucky SHD 400
#   49604 Lucky SHD 400
# against:
#   49612 FujiFilm Superia 400
#   49613 FujiFilm Superia 400
chroma_map:
  matrix: [1.3828, 0.6288]
  offset: [-0.0137, -0.0437]

# The map above is bent partway onto Superia, and then the pixels whose blue
# arrived with nothing in it are eased partway toward grey. The two work on
# different pixels: the map reshapes the colour that survived, and the easing
# takes the shout out of the colour that did not.
chroma_shape: 0.6
lost_colour: 0.3

# A gain of two stops on a sky that is already bright has nowhere to go, and
# blue stops at white while green carries on up, which leaves the sky pale
# cyan. This lets such a pixel darken by up to a stop and a half instead, so
# the colour the gains asked for survives.
highlight_headroom: 1.5

# A sky may not come out warmer than neutral, as on the other films.
sky_floor: 0.75

# Then each frame on its own, since the lab balanced every frame differently,
# some by two stops or more. A frame of leaves reads to the fit as a green
# cast, so how far it may move a frame toward magenta is capped.
frame_balance: 0.57
frame_tint_limit: 0.4
frame_balance_limit: 2.5

# Tones come back a little bunched toward the highlights.
roll_tone: 0.5

# Once balanced its colour is not squashed, so the gamut fit has nothing to do.
roll_fit: 0.0

# The frame balance above does this job, so the older balance is off.
neutral: 0.0
wb: 0.0
wb_clamp: 1.8
shadow_wb: 0.8

target_saturation: 0.26
max_vibrance: 1.1
knee: 0.22

black: 0.4
white: 99.7
max_stretch: 3.2
contrast: 0.065

chroma: 0.7

# Lamps at dusk keep half their warmth. A lit train interior held in full
# came out red; a dusk skyline wants all of it, which an override can ask.
lamp_guard: 0.5

sharpness: 0.5

# The film's own look against rolls shot alongside it, learned by
# tools/measure_look.rb from 6 pairs. Lightness only; --match gives a
# roll its own instead.
#   49603 Lucky SHD 400 with 49608 FujiFilm Superia 200, 49609 FujiFilm Superia 200, 49610 FujiFilm Superia 200
#   49604 Lucky SHD 400 with 49608 FujiFilm Superia 200, 49609 FujiFilm Superia 200, 49610 FujiFilm Superia 200
#   49602 Lucky SHD 400 with 49612 FujiFilm Superia 400, 49613 FujiFilm Superia 400
#   51054 Film type Uncatalogued with 51046 FujiFilm Superia 400, 51048 FujiFilm Superia 400, 51049 FujiFilm Superia 400
#   50193 Lucky SHD 400 with 50191 FujiFilm Superia 400, 50188 Kodak Gold 200, 50189 Kodak Gold 200, 50190 Kodak Gold 200
#   50194 Lucky SHD 400 with 50191 FujiFilm Superia 400, 50188 Kodak Gold 200, 50189 Kodak Gold 200, 50190 Kodak Gold 200
look:
  lightness:
